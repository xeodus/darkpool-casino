version: "0.1"
services:
  pg:
    image: postgres: 16-alpine
    environment:
      POSTGRES_USER: ricky
      POSTGRES_PASSWORD: Lucifer@
      POSTGRES_DB: goquant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goqqunt"]
      intervals: 2s
      timeout: 2s
      retries: 20
volumes:
  pgdata:
